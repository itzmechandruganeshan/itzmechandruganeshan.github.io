[project]
name = "virtual-me"
version = "0.1.0"
description = "Virtual Me — texts like Chandru. Jev decides, LLM speaks, code humanizes."
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
    "qdrant-client[fastembed]>=1.12",
    "feedparser>=6.0",
    "apscheduler>=3.10,<4",
    "cryptography>=43",
    "rapidfuzz>=3.9",
    "tenacity>=9.0",
    "composio>=0.22.0",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
