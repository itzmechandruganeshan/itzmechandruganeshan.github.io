# fly launch --no-deploy --copy-config   (then: fly volumes create vm_data --region sin --size 1)
app = "virtual-me-chandru"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "prod"
  RETRIEVAL_BACKEND = "cloud"
  DB_PATH = "/data/app.db"
  CHECKPOINT_PATH = "/data/checkpoints.db"
  QDRANT_LOCAL_PATH = "/data/qdrant"
  TIMEZONE = "Asia/Kolkata"

# Rebuilds the Qdrant `cards` collection on every deploy. It refuses to run while any public card
# still has `reviewed: false`, so nothing Chandru hasn't approved can ship.
[deploy]
  release_command = "python scripts/ingest.py"

[[mounts]]
  source = "vm_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
